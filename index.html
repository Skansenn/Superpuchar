// ── 8-bit sound ──
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  gn.gain.setValueAtTime(vol||0.14,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function sweep(f0,f1,dur,type,vol){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  gn.gain.setValueAtTime(vol||0.14,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}

async function loadLB(){
  try{
    const url = SB.url + '?select=nick,score,correct,created_at&order=score.desc,created_at.asc&limit=100';
    const r = await fetch(url, { headers: SB.headers });
    if(!r.ok) return [];
    const data = await r.json();
    return data.map(x=>({ nick:x.nick, score:x.score, correct:x.correct, ts:x.created_at }));
  }catch(e){ return []; }
}

async function saveScore(nick, score, correct){
  try{

      method:'POST',
      headers: SB.headers,
      body: JSON.stringify({ nick, score, correct })
    });
    return r.ok;
  }catch(e){ return false; }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  const shuffled=shuffle([...BANK]);
  const picked=[]; let lastCat=null;
  for(const q of shuffled){
    if(picked.length>=CONFIG.totalQuestions) break;
    if(q.cat===lastCat) continue;
    picked.push(q); lastCat=q.cat;
  }
  let i=0;
  while(picked.length<CONFIG.totalQuestions && i<shuffled.length){
    if(!picked.includes(shuffled[i])) picked.push(shuffled[i]); i++;
  }
  return picked.slice(0,CONFIG.totalQuestions);
}

function drawScene(){

  px(80,252,240,4,COL.line);
  px(172,52,56,8,COL.board);
  px(192,60,16,20,COL.post);

}
function drawHUD(){

}

let raf=0,lastT=0,lastTick=0;
function loop(ts){
  if(state==='play'){
    if(!lastT)lastT=ts;
    const dt=(ts-lastT)/16.67; lastT=ts;
    if(!ball){
      const frac=1-timeLeft/ROUND;
      const sp=BASE+(MAX-BASE)*frac;
      const prev=meter;
      meter+=mdir*sp*dt;
      if(meter>=1){meter=1;mdir=-1;} if(meter<=0){meter=0;mdir=1;}
      if((prev<PERFECT[0])!==(meter<PERFECT[0])||(prev>PERFECT[1])!==(meter>PERFECT[1])){ if(ts-lastTick>90){SFX.tick();lastTick=ts;} }
    }
  } else { lastT=0; }
  renderCanvasContent();
  raf=requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  ac(); SFX.start();
  score=0;streak=0;shots=0;made=0;time=ROUND;timeLeft=ROUND;
  meter=0;mdir=1;ball=null;flash=null;qpts=0;qok=0;qi=0;picked=null;
  state='play'; panel.innerHTML=''; showCanvas(true);
  hint.textContent='DOTKNIJ BOISKA — RZUT';
  tap.style.display='block';
  clearInterval(timerId);
  timerId=setInterval(()=>{ time--; timeLeft=time; if(time<=0){clearInterval(timerId); toQuiz();} },1000);
}

function shoot(){
  if(state!=='play'||ball)return;
  ball={x:200,y:220}; // freeze meter instantly
  SFX.shoot();
  const p=meter;
  const perfect=p>=PERFECT[0]&&p<=PERFECT[1];
  const good=p>=GOOD[0]&&p<=GOOD[1];
  const ok=perfect||good;
  shots++;
  const arcH=1+Math.abs(p-0.5)*1.3;
  let tt=0;
  const anim=setInterval(()=>{
    tt+=0.05;
    const x=200+(ok?0:68)*tt;
    const flat=220+(ok?-140:-110)*tt;
    const arc=Math.sin(tt*Math.PI)*140*arcH;
    ball={x:x,y:flat-arc+(ok?0:tt*tt*80)};
    if(tt>=1){
      clearInterval(anim);
      if(ok){
        made++;streak++;
        const pts=(perfect?5:3)+Math.floor(streak/3);
        score+=pts;
        flash={t:perfect?'PERFECT +'+pts:'SWISH +'+pts,c:perfect?COL.amber:COL.neon};
        perfect?SFX.perfect():SFX.swish();
      }else{
        streak=0;
        flash={t:p<0.5?'ZA KRÓTKO':'OBRĘCZ',c:COL.hot};
        SFX.miss();
      }
      if(score>best){best=score;}
      setTimeout(()=>{ball=null;flash=null;meter=0;mdir=1;},320);
    }
  },16);
}

function toQuiz(){
  state='quiz'; ball=null; flash=null; tap.style.display='none'; showCanvas(false);

  hint.textContent='ODPOWIADAJ SZYBKO';

}

    });

      '<div id="slval" style="font-size:32px;font-weight:bold;color:var(--amber);margin-bottom:12px;">'+mid+unit+'</div>'+

      '<div style="display:flex;justify-content:between;font-size:14px;color:var(--dim);margin-bottom:16px;">'+
        '<span style="flex:1;text-align:left;">'+item.min+'</span>'+
        '<span style="flex:1;text-align:right;">'+item.max+'</span>'+
      '</div>'+
    '</div>';
  }
  
  html += '<div id="fact-area"></div>'+
          '<div id="action-area">';
          
  if(item.type==='estimate'){
    html += '<button class="btn alt" id="slConfirm">ZATWIERDŹ</button>';
  }
  html += '</div>';
  
  panel.innerHTML=html;
  
  if(item.type==='abcd'){
    panel.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>handleChoiceAnswer(Number(b.dataset.i));
    });
  } else if(item.type==='tf'){
    panel.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>handleTFAnswer(b.dataset.v === 'true');
    });
  } else if(item.type==='estimate'){
    const sl = document.getElementById('slider');

    const unit = item.unit ? ' ' + item.unit : '';
    sl.oninput = () => out.textContent = sl.value + unit;
    document.getElementById('slConfirm').onclick = () => handleEstimateAnswer(Number(sl.value));
  }
}

function handleChoiceAnswer(index){
  if(picked!==null)return;
  picked=index;
  const item=quiz[qi];
  const btns=panel.querySelectorAll('.opt');
  
  btns[item.correct].classList.add('ok');
  if(index!==item.correct) btns[index].classList.add('no');
  
  const correct = (index===item.correct);
  let pts=0;
  if(correct){
    qok++;
    pts=Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  showAnswerFeedback(correct, pts, item.fact);
}

function handleTFAnswer(value){
  if(picked!==null)return;
  picked=value;
  const item=quiz[qi];
  const btns=panel.querySelectorAll('.opt');
  
  const correctIdx = item.correct ? 0 : 1;
  const chosenIdx = value ? 0 : 1;
  
  btns[correctIdx].classList.add('ok');
  if(chosenIdx!==correctIdx) btns[chosenIdx].classList.add('no');
  
  const correct = (value===item.correct);
  let pts=0;
  if(correct){
    qok++;
    pts=Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  showAnswerFeedback(correct, pts, item.fact);
}

function handleEstimateAnswer(value){
  if(picked!==null)return;
  picked=value;
  const item=quiz[qi];
  
  const correct = Math.abs(value-item.answer)<=item.tol;
  let pts=0;
  if(correct){
    qok++;
    pts=Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  
  const unit = item.unit ? ' ' + item.unit : '';
  const explanation = 'Twój typ: <b>'+value+unit+'</b> · Poprawnie: <b>'+item.answer+unit+'</b>.<br>'+item.fact;
  showAnswerFeedback(correct, pts, explanation);
}

function showAnswerFeedback(correct, pointsGained, explanationText){
  panel.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const sl = document.getElementById('slider');
  if(sl) sl.disabled = true;
  const slBtn = document.getElementById('slConfirm');
  if(slBtn) slBtn.disabled = true;
  
  correct ? SFX.right() : SFX.wrong();
  
  const factArea = document.getElementById('fact-area');
  const feedbackTitle = correct ? '<b class="neon">✓ DOBRZE!</b>' : '<b class="hot">✗ PUDŁO.</b>';
  const gainLabel = (correct && pointsGained > 0) ? ' <span class="amber">+' + pointsGained + ' pkt</span>' : '';
  factArea.innerHTML = 
    '<div class="lead" style="margin-top:12px;padding:12px;background:#0a0118;border-left:4px solid ' + (correct ? 'var(--neon)' : 'var(--hot)') + ';font-size:14px;line-height:1.4;">' +
      feedbackTitle + gainLabel + '<br>' +
      explanationText +
    '</div>';
    
  const actionArea = document.getElementById('action-area');
  const isLast = (qi >= QUIZ_COUNT - 1) || qTimeLeft <= 0;
  actionArea.innerHTML = 
    '<button class="btn" id="nextQuest">' + (isLast ? 'ZOBACZ WYNIK →' : 'DALEJ →') + '</button>';
    
  document.getElementById('nextQuest').onclick = () => {
    if(isLast){
      clearInterval(qTimerId);
      toResult();
    } else {
      qi++;
      picked=null;
      renderQuiz();
    }
  };
}

function toResult(){
  state='result'; clearInterval(qTimerId); SFX.over();
  try{localStorage.setItem('arcadeplk_best',String(best));}catch(e){}
  const acc=shots?Math.round(made/shots*100):0;
  panel.innerHTML =
    '<div class="center">'+
      '<div class="hot" style="letter-spacing:4px;font-size:14px">KONIEC WYZWANIA</div>'+
      '<div class="neon" style="font-size:clamp(52px,15vw,72px);font-weight:bold;text-shadow:0 0 20px '+COL.neon+'">'+score+'</div>'+
      '<div class="dim" style="font-size:clamp(13px,3.4vw,16px);line-height:1.7;margin:8px 0">'+
        'Rzuty: <span class="ink">'+shootScore+' pkt</span> ('+made+'/'+shots+', '+acc+'%)<br>'+
        'Quiz: <span class="amber">'+qok+'/'+QUIZ_COUNT+' → +'+qpts+' pkt</span>'+
      '</div>'+
      '<div class="lead" style="margin-top:6px">Wpisz nick, aby pojawić się w rankingu i zawalczyć o <b>bilety na Superpuchar</b>.</div>'+
      '<input class="nick" id="nick" maxlength="20" placeholder="Twój nick" autocomplete="off">'+
      '<div class="err" id="err"></div>'+
      '<button class="btn alt" id="submit">POKAŻ MOJE MIEJSCE →</button>'+
    '</div>';
  hint.textContent='';
  const nick=document.getElementById('nick');
  setTimeout(()=>nick.focus(),100);
  document.getElementById('submit').onclick=async ()=>{
    const v=(nick.value||'').trim();
    if(v.length<2){ document.getElementById('err').textContent='Wpisz nick (min. 2 znaki).'; return; }
    
    const submitBtn = document.getElementById('submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'ZAPISYWANIE...';
    
    const ok = await saveScore(v, score, qok);
    if(!ok){
      submitBtn.disabled = false;
      submitBtn.textContent = 'POKAŻ MOJE MIEJSCE →';
      document.getElementById('err').textContent = 'Nie udało się zapisać wyniku. Sprawdź połączenie i spróbuj ponownie.';
      return;
    }
    
    const list = await loadLB();
    showLeaderboard(list, v);
  };
}

let lbRefreshTimer = null;
function showLeaderboard(list, myNick){
  state='leaderboard';
  if(lbRefreshTimer) clearInterval(lbRefreshTimer);
  
  const myPos = myNick ? list.findIndex(x => x.nick === myNick && x.score === score) : -1;
  const top10 = list.slice(0, 10);
  
  let html = 
    '<div class="center">'+
      '<div class="amber" style="letter-spacing:2px;font-size:clamp(16px,4.4vw,20px);margin-bottom:4px">🏆 RANKING — TOP 10</div>'+
      (myPos >= 10 ? '<div class="dim" style="font-size:13px;margin-bottom:8px">Twoje miejsce: <span class="amber">'+(myPos+1)+'</span> ('+score+' pkt)</div>' : '')+
      '<div class="lb">';
      
  if(top10.length) {
    top10.forEach((e, i) => {
      const me = (myNick && e.nick === myNick && e.score === score);
      const prize = PRIZES_LIST[i] ? '<div class="prizetag">🎟️ ' + escapeHtml(PRIZES_LIST[i].t) + '</div>' : '';
      html += '<div class="e' + (me ? ' me' : '') + (i < PRIZES_LIST.length ? ' win' : '') + '">' +
                '<div class="erow">' +
                  '<span><span class="rank">' + (i+1) + '.</span><span class="who">' + escapeHtml(e.nick) + '</span></span>' +
                  '<span class="pts">' + e.score + ' pkt</span>' +
                '</div>' +
                prize +
              '</div>';
    });
  } else {
    html += '<div class="dim" style="padding:12px">Brak wyników — bądź pierwszy!</div>';
  }
  
  html += '</div>'+
      '<button class="btn" id="again">ZAGRAJ JESZCZE RAZ</button>'+
    '</div>';
    
  panel.innerHTML = html;
  document.getElementById('again').onclick = () => {
    if(lbRefreshTimer) { clearInterval(lbRefreshTimer); lbRefreshTimer = null; }
    showIntro();
  };
  hint.textContent='';
  
  lbRefreshTimer = setInterval(async () => {
    if(state !== 'leaderboard') return;
    const freshList = await loadLB();
    const container = panel.querySelector('.lb');
    if(!container) return;
    
    const freshTop10 = freshList.slice(0, 10);
    const freshMyPos = myNick ? freshList.findIndex(x => x.nick === myNick && x.score === score) : -1;
    
    const posLabel = panel.querySelector('.center > .dim');
    if(posLabel && freshMyPos >= 10) {
      posLabel.innerHTML = 'Twoje miejsce: <span class="amber">'+(freshMyPos+1)+'</span> ('+score+' pkt)';
    }
    
    let freshHtml = '';
    if(freshTop10.length) {
      freshTop10.forEach((e, i) => {
        const me = (myNick && e.nick === myNick && e.score === score);
        const prize = PRIZES_LIST[i] ? '<div class="prizetag">🎟️ ' + escapeHtml(PRIZES_LIST[i].t) + '</div>' : '';
        freshHtml += '<div class="e' + (me ? ' me' : '') + (i < PRIZES_LIST.length ? ' win' : '') + '">' +
                      '<div class="erow">' +
                        '<span><span class="rank">' + (i+1) + '.</span><span class="who">' + escapeHtml(e.nick) + '</span></span>' +
                        '<span class="pts">' + e.score + ' pkt</span>' +
                      '</div>' +
                      prize +
                    '</div>';
      });
    } else {
      freshHtml += '<div class="dim" style="padding:12px">Brak wyników — bądź pierwszy!</div>';
    }
    container.innerHTML = freshHtml;
  }, 5000);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ── input ──
tap.addEventListener('touchstart',e=>{e.preventDefault();shoot();},{passive:false});
tap.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){e.preventDefault();shoot();}});
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && state==='play'){e.preventDefault();shoot();}
});

showIntro();
</script>
</body>
</html>
