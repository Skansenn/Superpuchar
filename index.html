// ── 8-bit sound ──
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  gn.gain.setValueAtTime(vol||0.14,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function sweep(f0,f1,dur,type,vol){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  gn.gain.setValueAtTime(vol||0.14,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}

async function loadLB(){
  try{
    const url = SB.url + '?select=nick,score,correct,created_at&order=score.desc,created_at.asc&limit=100';
    const r = await fetch(url, { headers: SB.headers });
    if(!r.ok) return [];
    const data = await r.json();
    return data.map(x=>({ nick:x.nick, score:x.score, correct:x.correct, ts:x.created_at }));
  }catch(e){ return []; }
}

async function saveScore(nick, score, correct){
  try{
    const r = await fetch(SB.url, {
      method:'POST',
      headers: SB.headers,
      body: JSON.stringify({ nick, score, correct })
    });
    return r.ok;
  }catch(e){ return false; }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function isRulesQuestion(q) {
  const c = q.cat.toLowerCase();
  if (c.startsWith("plk") || c.startsWith("obl") || c.includes("mistrz") || c.includes("klub") || c.includes("puchar") || c.includes("mvp")) {
    return false;
  }
  return true;
}

function buildDeck(){
  const rulesDeck = shuffle(BANK.filter(isRulesQuestion));
  const generalDeck = shuffle(BANK.filter(q => !isRulesQuestion(q)));
  
  const picked = [];
  let lastCat = null;
  
  // Pick exactly 4 rules questions
  for(const q of rulesDeck) {
    if(picked.length >= 4) break;
    if(q.cat === lastCat) continue;
    picked.push(q);
    lastCat = q.cat;
  }
  if(picked.length < 4) {
    for(const q of rulesDeck) {
      if(picked.length >= 4) break;
      if(!picked.includes(q)) picked.push(q);
    }
  }
  
  // Pick exactly 6 general questions
  lastCat = null;
  const targetLen = 10;
  for(const q of generalDeck) {
    if(picked.length >= targetLen) break;
    if(q.cat === lastCat) continue;
    picked.push(q);
    lastCat = q.cat;
  }
  if(picked.length < targetLen) {
    for(const q of generalDeck) {
      if(picked.length >= targetLen) break;
      if(!picked.includes(q)) picked.push(q);
    }
  }
  
  return picked;
}

// Particle system
let particles = [];
function spawnParticles(x, y, color) {
  for(let i=0; i<15; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.8) * 6,
      radius: Math.random() * 3 + 1,
      color: color,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.02
    });
  }
}
function updateParticles() {
  for(let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.alpha -= p.decay;
    if(p.alpha <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for(const p of particles) {
    g.save();
    g.globalAlpha = p.alpha;
    g.shadowColor = p.color;
    g.shadowBlur = 4;
    g.fillStyle = p.color;
    g.beginPath();
    g.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
    g.fill();
    g.restore();
  }
}

    const px0 = netX0 + netW0 * t;
    g.beginPath();

    g.lineTo(netX1 + netW1 * (1 - t), netY + netH);

function drawBall(x,y, radius = 11){
  // Sphere gradient (3D look)
  const ballGrad = g.createRadialGradient(x - radius*0.3, y - radius*0.3, radius*0.1, x, y, radius);
  ballGrad.addColorStop(0, '#ffa87d');
  ballGrad.addColorStop(0.3, '#ff5722');
  ballGrad.addColorStop(1, '#942200');
  
  g.beginPath();
  g.arc(x, y, radius, 0, 2*Math.PI);
  g.fillStyle = ballGrad;
  g.fill();
  
  // Draw ball lines
  g.strokeStyle = 'rgba(0, 0, 0, 0.4)';
  g.lineWidth = 1.2;
  
  // Horizontal line
  g.beginPath();
  g.ellipse(x, y, radius, radius*0.2, 0, 0, 2*Math.PI);
  g.stroke();
  
  // Vertical line
  g.beginPath();
  g.ellipse(x, y, radius*0.2, radius, 0, 0, 2*Math.PI);
  g.stroke();
}

function drawMeter(){
  const bx=60,by=274,bw=280,bh=12;
  
  // Background track
  g.fillStyle = '#151d30';
  g.beginPath();
  g.roundRect(bx, by, bw, bh, 6);
  g.fill();
  g.strokeStyle = '#22304a';
  g.lineWidth = 1;
  g.stroke();
  
  // GOOD target zone (green glow)
  g.fillStyle = 'rgba(40, 209, 124, 0.25)';
  g.fillRect(bx+bw*GOOD[0], by, bw*(GOOD[1]-GOOD[0]), bh);
  
  // PERFECT target zone (gold glow)
  g.fillStyle = 'rgba(255, 194, 77, 0.6)';
  g.fillRect(bx+bw*PERFECT[0], by, bw*(PERFECT[1]-PERFECT[0]), bh);
  
  // Border line of zones
  g.strokeStyle = 'rgba(40, 209, 124, 0.5)';
  g.strokeRect(bx+bw*GOOD[0], by, bw*(GOOD[1]-GOOD[0]), bh);
  g.strokeStyle = 'rgba(255, 194, 77, 0.8)';
  g.strokeRect(bx+bw*PERFECT[0], by, bw*(PERFECT[1]-PERFECT[0]), bh);
  
  // Needle (glowing pink pointer)
  const nx = bx + bw * meter;
  g.shadowColor = '#ff2d95';
  g.shadowBlur = 6;
  g.fillStyle = '#ff2d95';
  
  g.beginPath();
  g.moveTo(nx - 4, by - 4);
  g.lineTo(nx + 4, by - 4);
  g.lineTo(nx, by + bh + 4);
  g.closePath();
  g.fill();
  
  g.shadowColor = 'transparent';
  g.shadowBlur = 0;
}

let raf=0,lastT=0,lastTick=0;
function loop(ts){
  if(state==='play'){
    if(!lastT)lastT=ts;
    const dt=(ts-lastT)/16.67; lastT=ts;
    if(!ball){
      const frac=1-timeLeft/ROUND;
      const sp=BASE+(MAX-BASE)*frac;
      const prev=meter;
      meter+=mdir*sp*dt;
      if(meter>=1){meter=1;mdir=-1;} if(meter<=0){meter=0;mdir=1;}
      if((prev<PERFECT[0])!==(meter<PERFECT[0])||(prev>PERFECT[1])!==(meter>PERFECT[1])){ if(ts-lastTick>90){SFX.tick();lastTick=ts;} }
    }
  } else { lastT=0; }
  renderCanvasContent();
  raf=requestAnimationFrame(loop);
}

function shoot(){
  if(state!=='play'||ball)return;
  ball={x:200,y:220,size:13}; // freeze meter instantly
  SFX.shoot();
  const p=meter;
  const perfect=p>=PERFECT[0]&&p<=PERFECT[1];
  const good=p>=GOOD[0]&&p<=GOOD[1];
  const ok=perfect||good;
  shots++;
  const arcH=1+Math.abs(p-0.5)*1.3;
  let tt=0;
  const anim=setInterval(()=>{
    tt+=0.05;
    const x=200+(ok?0:68)*tt;
    const flat=220+(ok?-140:-110)*tt;
    const arc=Math.sin(tt*Math.PI)*140*arcH;
    const size=13 - 5.5*tt; // 3D depth shrinking
    ball={x:x,y:flat-arc+(ok?0:tt*tt*80),size:size};
    if(tt>=1){
      clearInterval(anim);
      if(ok){
        made++;streak++;
        const pts=(perfect?5:3)+Math.floor(streak/3);
        score+=pts;
        flash={t:perfect?'PERFECT +'+pts:'SWISH +'+pts,c:perfect?COL.amber:COL.neon};
        spawnParticles(200, 106, perfect ? COL.amber : COL.neon);
        perfect?SFX.perfect():SFX.swish();
      }else{
        streak=0;
        flash={t:p<0.5?'ZA KRÓTKO':'OBRĘCZ',c:COL.hot};
        SFX.miss();
      }
      if(score>best){best=score;}
      setTimeout(()=>{ball=null;flash=null;meter=0;mdir=1;},320);
    }
  },16);
}

function handleChoiceAnswer(index){

  const item=quiz[qi];

  if(index!==item.correct) btns[index].classList.add('wrong');
  
  const correct = (index===item.correct);
  let pts=0;
  if(correct){
    qok++;
    pts=Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  showAnswerFeedback(correct, pts, item.fact);
}

function handleTFAnswer(value){
  if(picked!==null)return;
  picked=value;
  const item=quiz[qi];
  const btns=panel.querySelectorAll('.opt');
  
  const correctIdx = item.correct ? 0 : 1;
  const chosenIdx = value ? 0 : 1;
  
  btns[correctIdx].classList.add('correct');
  if(chosenIdx!==correctIdx) btns[chosenIdx].classList.add('wrong');
  
  const correct = (value===item.correct);
  let pts=0;
  if(correct){
    qok++;
    pts=Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  showAnswerFeedback(correct, pts, item.fact);
}

function handleEstimateAnswer(value){
  if(picked!==null)return;
  picked=value;
  const item=quiz[qi];
  
  const diff = Math.abs(value - item.answer);
  const correct = diff <= 5;
  let pts=0;
  if(correct){
    qok++;
    const basePts = Math.round(QMIN+(QMAX-QMIN)*(qTimeLeft/QUIZ_TIME));
    if (diff === 0) {
      pts = basePts;
    } else if (diff === 1) {
      pts = Math.round(basePts * 0.75);
    } else if (diff <= 3) {
      pts = Math.round(basePts * 0.50);
    } else {
      pts = Math.round(basePts * 0.25);
    }
    qpts+=pts; score+=pts;
  }
  if(score>best)best=score;
  
  const unit = item.unit ? ' ' + item.unit : '';
  const explanation = 'Twój typ: <b>'+value+unit+'</b> · Poprawnie: <b>'+item.answer+unit+'</b>.<br>'+item.fact;
  showAnswerFeedback(correct, pts, explanation);
}

function showAnswerFeedback(correct, pointsGained, explanationText){
  panel.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const sl = document.getElementById('slider');
  if(sl) sl.disabled = true;
  const slBtn = document.getElementById('slConfirm');
  if(slBtn) slBtn.disabled = true;
  
  correct ? SFX.right() : SFX.wrong();
  
  const factArea = document.getElementById('fact-area');
  if(factArea){
    const feedbackTitle = correct ? '<b>✓ Dobrze!</b>' : '<b>✗ Pudło.</b>';
    const gainLabel = (correct && pointsGained > 0) ? ' <span class="gain">+' + pointsGained + ' pkt</span>' : '';
    factArea.innerHTML = feedbackTitle + gainLabel + '<br>' + explanationText;
    factArea.classList.add('show');
  }
  
  const actionArea = document.getElementById('action-area');
  if(actionArea){
    const isLast = (qi >= QUIZ_COUNT - 1) || qTimeLeft <= 0;
    actionArea.innerHTML = '<button class="btn" id="nextQuest">' + (isLast ? 'ZOBACZ WYNIK →' : 'DALEJ →') + '</button>';
    document.getElementById('nextQuest').onclick = () => {
      if(isLast){
        clearInterval(qTimerId);
        toResult();
      } else {
        qi++;
        picked=null;
        renderQuiz();
      }
    };
  }
}

function toResult(){
  state='result'; clearInterval(qTimerId); SFX.over();
  try{localStorage.setItem('arcadeplk_best',String(best));}catch(e){}
  const acc=shots?Math.round(made/shots*100):0;
  panel.innerHTML =
    '<div class="center">'+
      '<div class="eyebrow" style="color:var(--accent)">Koniec Wyzwania</div>'+
      '<div class="scorebig">'+score+'</div>'+
      '<div class="scoresub">'+
        'Rzuty: <b>'+shootScore+' pkt</b> ('+made+'/'+shots+', '+acc+'%)<br>'+
        'Quiz: <b>'+qok+'/'+QUIZ_COUNT+' → +'+qpts+' pkt</b>'+
      '</div>'+
      '<div class="gate" style="text-align:left;margin-top:16px;">'+
        '<label for="nick">Wpisz swój nick</label>'+
        '<div class="sub" style="font-size:13px;color:var(--muted);margin-bottom:8px;">Zapisz wynik w rankingu i walcz o bilety na Superpuchar Polski w Sosnowcu!</div>'+
        '<input class="field" id="nick" maxlength="20" placeholder="Twój nick" autocomplete="off">'+
        '<div class="err" id="err"></div>'+
        '<button class="btn" id="submit">Zapisz i Pokaż Miejsce →</button>'+
      '</div>'+
    '</div>';
  hint.textContent='';
  const nick=document.getElementById('nick');
  setTimeout(()=>nick.focus(),100);
  document.getElementById('submit').onclick=async ()=>{
    const v=(nick.value||'').trim();
    const errDiv = document.getElementById('err');
    if(v.length<2){
      errDiv.textContent='Wpisz nick (min. 2 znaki).';
      errDiv.style.display='block';
      return;
    }
    errDiv.style.display='none';
    
    const submitBtn = document.getElementById('submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'ZAPISYWANIE...';
    
    const ok = await saveScore(v, score, qok);
    if(!ok){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Zapisz i Pokaż Miejsce →';
      errDiv.textContent = 'Nie udało się zapisać wyniku. Sprawdź połączenie i spróbuj ponownie.';
      errDiv.style.display='block';
      return;
    }
    
    const list = await loadLB();
    showLeaderboard(list, v);
  };
}

let lbRefreshTimer = null;
function showLeaderboard(list, myNick){
  state='leaderboard';
  if(lbRefreshTimer) clearInterval(lbRefreshTimer);
  
  const myPos = myNick ? list.findIndex(x => x.nick === myNick && x.score === score) : -1;
  const top10 = list.slice(0, 10);
  
  let html = 
    '<div class="center">'+
      '<div class="eyebrow" style="margin-bottom:8px">Ranking — Top 10</div>';
      
  if(myPos >= 10) {
    html += '<div class="standing"><div class="pos">#'+(myPos+1)+'</div><div class="posl">Twoje miejsce ('+score+' pkt)</div></div>';
  }
  
  html += '<div class="lb" style="margin-top:16px">';
  
  if(top10.length) {
    top10.forEach((e, i) => {
      const me = (myNick && e.nick === myNick && e.score === score);
      const isTop = i < 3;
      const prize = PRIZES_LIST[i] ? '<div class="prizetag">🎟️ ' + escapeHtml(PRIZES_LIST[i].t) + '</div>' : '';
      html += '<div class="lbrow' + (me ? ' me' : '') + (isTop ? ' top' : '') + '">' +
                '<div class="rk">' + (i+1) + '.</div>' +
                '<div class="nm">' +
                  '<div>' + escapeHtml(e.nick) + '</div>' +
                  prize +
                '</div>' +
                '<div class="sc">' + e.score + ' pkt</div>' +
              '</div>';
    });
  } else {
    html += '<div class="lead" style="padding:12px">Brak wyników — bądź pierwszy!</div>';
  }
  
  html += '</div>'+
      '<button class="btn alt" id="again">Zagraj jeszcze raz</button>'+
    '</div>';
    
  panel.innerHTML = html;
  document.getElementById('again').onclick = () => {
    if(lbRefreshTimer) { clearInterval(lbRefreshTimer); lbRefreshTimer = null; }
    showIntro();
  };
  hint.textContent='';
  
  lbRefreshTimer = setInterval(async () => {
    if(state !== 'leaderboard') return;
    const freshList = await loadLB();
    const container = panel.querySelector('.lb');
    if(!container) return;
    
    const freshTop10 = freshList.slice(0, 10);
    const freshMyPos = myNick ? freshList.findIndex(x => x.nick === myNick && x.score === score) : -1;
    
    const standingBox = panel.querySelector('.standing');
    if(standingBox && freshMyPos >= 10) {
      standingBox.innerHTML = '<div class="pos">#'+(freshMyPos+1)+'</div><div class="posl">Twoje miejsce ('+score+' pkt)</div>';
    }
    
    let freshHtml = '';
    if(freshTop10.length) {
      freshTop10.forEach((e, i) => {
        const me = (myNick && e.nick === myNick && e.score === score);
        const isTop = i < 3;
        const prize = PRIZES_LIST[i] ? '<div class="prizetag">🎟️ ' + escapeHtml(PRIZES_LIST[i].t) + '</div>' : '';
        freshHtml += '<div class="lbrow' + (me ? ' me' : '') + (isTop ? ' top' : '') + '">' +
                      '<div class="rk">' + (i+1) + '.</div>' +
                      '<div class="nm">' +
                        '<div>' + escapeHtml(e.nick) + '</div>' +
                        prize +
                      '</div>' +
                      '<div class="sc">' + e.score + ' pkt</div>' +
                    '</div>';
      });
    } else {
      freshHtml += '<div class="lead" style="padding:12px">Brak wyników — bądź pierwszy!</div>';
    }
    container.innerHTML = freshHtml;
  }, 5000);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ── input ──
document.addEventListener('touchstart',e=>{
  if(state!=='play')return;
  if(e.target.tagName==='BUTTON'||e.target.closest('button'))return;
  e.preventDefault(); shoot();
},{passive:false});

document.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  if(e.pointerType==='touch')return;
  if(e.target.tagName==='BUTTON'||e.target.closest('button'))return;
  e.preventDefault(); shoot();
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space' && state==='play'){e.preventDefault(); shoot();}
});

showIntro();
</script>
</body>
</html>
